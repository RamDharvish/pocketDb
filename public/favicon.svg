      />
      <ellipse cx="50" cy="64" rx="18" ry="5" fill="#6EE7B7" opacity="0.8" />
      <circle cx="50" cy="68" r="1.75" fill="#FFFFFF" />
    </g>

    <circle cx="50" cy="84" r="2" fill="#38BDF8" opacity="0.85" />
